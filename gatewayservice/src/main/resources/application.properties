spring.application.name=gatewayservice
server.port=8080

# The modern property path for SB 4.0.2 / Cloud 2025.x
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable SpringDoc
springdoc.api-docs.enabled=true

# Configure the aggregated URLs
# The name is what appears in the dropdown; the url is the path through the gateway
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/userservice/v3/api-docs

springdoc.swagger-ui.urls[1].name=Patient Service
springdoc.swagger-ui.urls[1].url=/patientservice/v3/api-docs

springdoc.swagger-ui.urls[2].name=Doctor Service
springdoc.swagger-ui.urls[2].url=/doctorservice/v3/api-docs

springdoc.swagger-ui.urls[3].name=Appointment Service
springdoc.swagger-ui.urls[3].url=/appointmentservice/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Apply to all routes
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-Requested-With
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Cache the preflight response for 1 hour
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600