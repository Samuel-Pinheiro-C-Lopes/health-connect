# -----------------------------------------------------------------------------
# Doctor Service - local defaults
# -----------------------------------------------------------------------------

spring.application.name=doctorservice

# If you run via Docker/compose, prefer: jdbc:postgresql://doctor-db:5432/doctor_service
# If you run locally (without Docker DNS), prefer: jdbc:postgresql://localhost:5433/doctor_service
spring.datasource.url=jdbc:postgresql://localhost:5433/doctor_service
spring.datasource.username=admin
spring.datasource.password=secret_doctor_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=secret

app.broker.queue.person.bind=person.bind

# JWT validation (must match userservice issuer/secret)
app.authentication.token.secret=change-me
app.authentication.token.issuer=health-connect

# Roles (string values must match what you put in the JWT "roles" claim)
app.security.roles.admin=ADMIN
app.security.roles.user=USER
app.security.roles.manager=MANAGER
app.security.roles.doctor=DOCTOR
