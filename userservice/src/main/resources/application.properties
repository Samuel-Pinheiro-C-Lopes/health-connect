spring.application.name=userservice
server.port=8081
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5435/user_service
spring.datasource.username=admin
spring.datasource.password=secret_user_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000

# COMMON CONFIG
spring.config.import=optional:configserver:http://localhost:8888

app.broker.queue.person.bind=person.bind

app.security.users.admin.username=ADMIN
app.security.users.admin.password=12345