spring.application.name=appointmentservice
server.port=8084
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/appointment_service
spring.datasource.username=admin
spring.datasource.password=secret_appoint_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000

# RABBIT
app.broker.queue.appointment.bind=appointment.bind

# COMMON CONFIG
spring.config.import=optional:configserver:http://localhost:8888